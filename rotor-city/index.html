<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<title>Rotor City</title>
<style>
:root{--bg:#07090f;--panel:rgba(10,14,24,.9);--panel2:rgba(24,31,50,.9);--line:rgba(140,170,255,.2);--text:#e8eefc;--dim:#8d9bb8;--acc:#2ee6ff;--acc2:#ff3d7f;--gold:#ffc83d;--good:#3dff8a;--bad:#ff4d4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
#gl{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.osd{position:fixed;font:700 15px/1.3 ui-monospace,Consolas,"Courier New",monospace;color:#fff;text-shadow:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;pointer-events:none;white-space:pre}
#osdTL{top:calc(12px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left))}
#osdTR{top:calc(12px + env(safe-area-inset-top));right:calc(200px + env(safe-area-inset-right));text-align:right}
#osdBL{bottom:16px;left:calc(14px + env(safe-area-inset-left))}
#osdBR{bottom:16px;right:calc(14px + env(safe-area-inset-right));text-align:right}
#osdMis{top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;font-size:16px}
#center{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);font:900 46px/1.1 system-ui,sans-serif;letter-spacing:.06em;text-align:center;color:#fff;text-shadow:0 0 18px rgba(0,0,0,.7),0 2px 0 #000;pointer-events:none;white-space:pre}
#center small{display:block;font-size:17px;font-weight:600;letter-spacing:.02em;opacity:.85;margin-top:8px}
#dmg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,0,30,.55));opacity:0}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:30}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--gold);padding:10px 16px;border-radius:10px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .35s ease-out}
.toast small{display:block;font-weight:500;color:var(--dim)}
@keyframes tin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;background:radial-gradient(ellipse at 50% 30%,rgba(7,9,15,.25),rgba(7,9,15,.78))}
#ui.hidden{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(980px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 70px rgba(0,0,0,.55);backdrop-filter:blur(6px);touch-action:pan-y}
.panel.narrow{width:min(520px,100%)}
h1{margin:0;font-size:clamp(34px,7vw,64px);font-weight:900;letter-spacing:.08em;background:linear-gradient(90deg,var(--acc),#9d7bff,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
h2{margin:0 0 14px;font-size:24px;letter-spacing:.04em}
h3{margin:16px 0 8px;font-size:15px;color:var(--acc);letter-spacing:.08em;text-transform:uppercase}
p{color:var(--dim);line-height:1.5;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{appearance:none;border:1px solid rgba(46,230,255,.35);background:linear-gradient(180deg,rgba(46,230,255,.16),rgba(46,230,255,.05));color:var(--text);padding:12px 18px;border-radius:11px;font:700 15px system-ui,sans-serif;cursor:pointer;letter-spacing:.03em}
.btn:hover,.btn:focus-visible{border-color:var(--acc);background:rgba(46,230,255,.22);outline:none}
.btn.pri{background:linear-gradient(180deg,#2ee6ff,#1aa6c9);color:#03111a;border-color:transparent}
.btn.pink{border-color:rgba(255,61,127,.5);background:linear-gradient(180deg,rgba(255,61,127,.25),rgba(255,61,127,.06))}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.menu-main{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:20px}
.menu-main .btn{padding:16px;font-size:17px}
.stat{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-weight:700}
.coin{color:var(--gold)}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#9d7bff)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;color:var(--text);font:inherit}
.card:hover,.card:focus-visible{border-color:var(--acc);outline:none}
.card.locked{opacity:.45;cursor:not-allowed}
.card.sel{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.card b{font-size:17px}
.card .ic{font-size:28px}
.stars{color:var(--gold);letter-spacing:2px;font-size:18px}
.stars i{color:rgba(255,255,255,.18);font-style:normal}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn.on{background:var(--acc);color:#03111a}
.set{display:grid;grid-template-columns:minmax(120px,190px) 1fr 64px;gap:10px;align-items:center;margin:7px 0}
.set label{color:var(--dim);font-size:14px}
.set output{font:700 13px ui-monospace,monospace;text-align:right}
input[type=range]{width:100%;accent-color:var(--acc)}
select{background:#111827;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.kbd{display:inline-block;min-width:26px;text-align:center;padding:2px 7px;border-radius:6px;background:#1b2338;border:1px solid #33405f;font:700 12px ui-monospace,monospace;margin:1px}
.swatch{width:38px;height:38px;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative}
.swatch.on{border-color:#fff}
.swatch.lock::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
.sbar{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.ach.off{opacity:.4;filter:grayscale(1)}
.ach .ic{font-size:26px}
.big-stars{font-size:54px;color:var(--gold);letter-spacing:8px;text-align:center}
.big-stars i{color:rgba(255,255,255,.15);font-style:normal}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:10}
#touch.on{display:block}
.stick{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:min(38vmin,180px);height:min(38vmin,180px);border-radius:24px;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);pointer-events:auto;touch-action:none}
#stL{left:calc(18px + env(safe-area-inset-left))}#stR{right:calc(18px + env(safe-area-inset-right))}
.knob{position:absolute;width:46%;height:46%;left:27%;top:27%;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.55),rgba(255,255,255,.15));border:2px solid rgba(255,255,255,.5)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;width:60px;height:60px;display:grid;place-items:center;font:800 12px system-ui;color:#fff;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)}
.tb:active,.tb.on{background:rgba(46,230,255,.35)}
#tFire{width:84px;height:84px;right:calc(min(38vmin,180px) + 34px);bottom:calc(30px + env(safe-area-inset-bottom));background:rgba(255,61,127,.3);border-color:rgba(255,61,127,.8);font-size:15px}
#tCam,#tMode,#tReset{width:50px;height:50px;font-size:11px;top:calc(84px + env(safe-area-inset-top))}
#tReset{left:calc(14px + env(safe-area-inset-left))}#tMode{left:calc(72px + env(safe-area-inset-left))}#tCam{left:calc(130px + env(safe-area-inset-left))}
body.touchmode #osdBL,body.touchmode #osdBR{bottom:calc(min(38vmin,180px) + 30px)}
#tPause{left:calc(188px + env(safe-area-inset-left));top:calc(84px + env(safe-area-inset-top));width:50px;height:50px}
#rotate{position:fixed;inset:0;display:none;z-index:50;background:#07090fee;place-items:center;text-align:center;font-weight:800;font-size:20px;padding:30px}
@media (orientation:portrait) and (pointer:coarse){#rotate.need{display:grid}}
@media (max-width:900px){.osd{font-size:12px}#osdMis{font-size:13px}#osdTR{right:calc(140px + env(safe-area-inset-right))}#center{font-size:32px}.set{grid-template-columns:110px 1fr 54px}}
#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:var(--bg);font-weight:700;letter-spacing:.1em;color:var(--dim)}
</style>
</head>
<body>
<canvas id="hud"></canvas>
<div id="dmg"></div>
<div class="osd" id="osdTL"></div>
<div class="osd" id="osdTR"></div>
<div class="osd" id="osdBL"></div>
<div class="osd" id="osdBR"></div>
<div class="osd" id="osdMis"></div>
<div id="center"></div>
<div id="toasts"></div>
<div id="touch">
  <div class="stick" id="stL"><div class="knob"></div></div>
  <div class="stick" id="stR"><div class="knob"></div></div>
  <div class="tb" id="tFire">FIRE</div>
  <div class="tb" id="tCam">CAM</div>
  <div class="tb" id="tMode">MODE</div>
  <div class="tb" id="tReset">RESET</div>
  <div class="tb" id="tPause">II</div>
</div>
<div id="ui" class="hidden"></div>
<div id="rotate">Rotate your phone to landscape 🔄</div>
<div id="boot">BUILDING ROTOR CITY…</div>
<script>
// If the 3D engine can't be fetched (offline), say so instead of showing a blank page.
setTimeout(function(){ if(!window.__rcStarted){ var b=document.getElementById('boot'); if(b) b.innerHTML='Could not load the 3D engine (three.js) from cdn.jsdelivr.net.<br>Check your internet connection and reload.'; } }, 9000);
</script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
window.__rcStarted = true;

/* =====================================================================
   ROTOR CITY — quadcopter flight & strike sim
   Sections: utils · save/progression · platform bridge · rates/expo ·
   input · audio · world · quad physics · weapons/entities · missions ·
   HUD · menus · main loop
   ===================================================================== */

// ---------------------------------------------------------------- utils
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const DEG = Math.PI / 180, G = 9.81, RHO = 1.225;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmtTime = s => { const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r.toFixed(2).padStart(5, '0')}`; };
const todayStr = (d = new Date()) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const getPath = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const setPath = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };

// ------------------------------------------------- save & progression
const SAVE_KEY = 'rotorcity.save.v1';
function defaultSettings() {
  return {
    input: 'auto', mode: 'ALT', kbThrow: 0.75,
    rates: { roll: { rc: 1.0, sr: 0.70, ex: 0.30 }, pitch: { rc: 1.0, sr: 0.70, ex: 0.30 }, yaw: { rc: 1.0, sr: 0.50, ex: 0.20 } },
    angleMax: 50, thrMid: 0.5, thrExpo: 0.25,
    camTilt: 25, fov: 92, quality: 'high', tod: 'dusk', stickViz: true,
    wind: 0.4, battery: 'extended', damage: 'normal', propwash: true,
    vol: { master: 0.8, motor: 0.7, sfx: 0.8 },
    gp: {
      preset: 'gamepad', deadband: 0.05,
      axes: { thr: { i: 1, inv: true, min: -1, max: 1 }, yaw: { i: 0, inv: false, min: -1, max: 1 }, pitch: { i: 3, inv: true, min: -1, max: 1 }, roll: { i: 2, inv: false, min: -1, max: 1 } },
      btn: { fire: [{ t: 'b', i: 0 }, { t: 'b', i: 7 }], cam: [{ t: 'b', i: 1 }], mode: [{ t: 'b', i: 2 }], reset: [{ t: 'b', i: 3 }], arm: [{ t: 'b', i: 4 }], pause: [{ t: 'b', i: 9 }] }
    }
  };
}
const GP_PRESETS = {
  gamepad: () => defaultSettings().gp,
  rc: () => ({ preset: 'rc', deadband: 0.01,
    axes: { thr: { i: 2, inv: false, min: -1, max: 1 }, yaw: { i: 3, inv: false, min: -1, max: 1 }, pitch: { i: 1, inv: false, min: -1, max: 1 }, roll: { i: 0, inv: false, min: -1, max: 1 } },
    btn: { fire: [{ t: 'b', i: 0 }], cam: [{ t: 'b', i: 1 }], mode: [{ t: 'b', i: 2 }], reset: [{ t: 'b', i: 3 }], arm: [], pause: [] } })
};
function defaultSave() {
  return { coins: 0, xp: 0, owned: ['sparrow'], drone: 'sparrow', color: 0, colorsOwned: [0, 1], ach: {}, missions: {}, chips: [], firstRun: true,
    stats: { rockets: 0, balloons: 0, hornets: 0, turrets: 0, gates: 0, deliveries: 0, crashes: 0, flightTime: 0, maxSpeed: 0, maxAlt: 0 },
    daily: { last: '', streak: 0 }, settings: defaultSettings() };
}
function deepMerge(base, over) {
  for (const k in over) {
    const b = base[k], o = over[k];
    if (o && typeof o === 'object' && !Array.isArray(o) && b && typeof b === 'object' && !Array.isArray(b)) deepMerge(b, o);
    else base[k] = o;
  }
  return base;
}
const SAVE = (() => { const s = defaultSave(); try { const raw = localStorage.getItem(SAVE_KEY); if (raw) deepMerge(s, JSON.parse(raw)); } catch (e) {} return s; })();
const S = SAVE.settings;
let saveTimer = 0;
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }, 300); }

// Hook points for a future Android build (Play Games achievements/leaderboards, haptics).
// In the browser they are no-ops; a WebView wrapper can inject window.AndroidBridge.
const Platform = {
  unlockAchievement(id) { try { window.AndroidBridge?.unlockAchievement?.(id); } catch (e) {} },
  submitScore(board, value) { try { window.AndroidBridge?.submitScore?.(board, value); } catch (e) {} },
  vibrate(ms) { try { navigator.vibrate?.(ms); } catch (e) {} }
};

const ACH = [
  { id: 'first_flight', ic: '🛫', name: 'Wheels Up', desc: 'Take off for the first time', coins: 50 },
  { id: 'school', ic: '🎓', name: 'Licensed Pilot', desc: 'Complete Flight School', coins: 100 },
  { id: 'speed150', ic: '💨', name: 'Speed Demon', desc: 'Exceed 150 km/h', coins: 150 },
  { id: 'alt300', ic: '☁️', name: 'Cloud Scraper', desc: 'Climb above 300 m', coins: 150 },
  { id: 'spire', ic: '🗼', name: 'Top of the World', desc: 'Land on the Spire Tower helipad', coins: 250 },
  { id: 'bridge', ic: '🌉', name: 'Thread the Needle', desc: 'Fly under the suspension bridge', coins: 100 },
  { id: 'flip', ic: '🔄', name: 'Freestyler', desc: 'Do a full flip or roll in ACRO mode', coins: 100 },
  { id: 'dive', ic: '🪂', name: 'Tower Dive', desc: 'Drop 120 m in under 5 seconds', coins: 150 },
  { id: 'balloons50', ic: '🎈', name: 'Pop Star', desc: 'Pop 50 balloons', coins: 200 },
  { id: 'rockets100', ic: '🚀', name: 'Rocket Rain', desc: 'Fire 100 rockets', coins: 150 },
  { id: 'hornets25', ic: '🐝', name: 'Exterminator', desc: 'Destroy 25 hornet drones', coins: 250 },
  { id: 'flawless', ic: '🛡️', name: 'Untouchable', desc: 'Finish a combat mission without taking damage', coins: 300 },
  { id: 'courier10', ic: '📦', name: 'Special Delivery', desc: 'Deliver 10 packages', coins: 150 },
  { id: 'turtle', ic: '🐢', name: 'Turtle Mode', desc: 'Crash upside down', coins: 25 },
  { id: 'endurance', ic: '⏱️', name: 'Marathon', desc: 'Fly 5 minutes without crashing', coins: 200 },
  { id: 'chips', ic: '💾', name: 'Data Hoarder', desc: 'Collect every data chip in Free Flight', coins: 500 },
  { id: 'allstars', ic: '⭐', name: 'Ace Pilot', desc: 'Earn 3 stars on every mission', coins: 1000 },
  { id: 'streak7', ic: '📅', name: 'Dedicated', desc: 'Claim the daily reward 7 days in a row', coins: 300 },
  { id: 'level10', ic: '🎖️', name: 'Veteran', desc: 'Reach pilot level 10', coins: 500 },
  { id: 'hangar', ic: '🏆', name: 'Fleet Commander', desc: 'Own every drone', coins: 500 }
];
const levelFor = xp => Math.floor(Math.sqrt(xp / 120)) + 1;
const xpForLevel = l => (l - 1) * (l - 1) * 120;
function addCoins(n, xp = n) {
  const before = levelFor(SAVE.xp);
  SAVE.coins += Math.round(n); SAVE.xp += Math.round(xp);
  const after = levelFor(SAVE.xp);
  if (after > before) { toast(`Pilot level ${after}!`, 'New hangar colors may be affordable', '#9d7bff'); sfx.achieve(); if (after >= 10) unlock('level10'); }
  persist();
}
function unlock(id) {
  if (SAVE.ach[id]) return;
  const a = ACH.find(x => x.id === id); if (!a) return;
  SAVE.ach[id] = Date.now(); SAVE.coins += a.coins; persist();
  toast(`${a.ic} ${a.name}`, `${a.desc} · +${a.coins} coins`);
  Platform.unlockAchievement(id); sfx.achieve();
}
function toast(title, sub = '', color) {
  const el = document.createElement('div'); el.className = 'toast';
  if (color) el.style.borderLeftColor = color;
  el.innerHTML = `${title}${sub ? `<small>${sub}</small>` : ''}`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .5s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 500); }, 3200);
}

// ---------------------------------------------------- rates & expo
// Betaflight-style rates: RC rate, super rate, RC expo -> deg/s.
function bfRate(x, r) {
  const a = Math.abs(x);
  let c = x;
  if (r.ex) c = x * a * a * a * r.ex + x * (1 - r.ex);
  let rc = r.rc; if (rc > 2) rc += 14.54 * (rc - 2);
  let rate = 200 * rc * c;
  if (r.sr) rate *= 1 / clamp(1 - a * r.sr, 0.01, 1);
  return rate;
}
const expoStick = (x, ex) => x * Math.abs(x) ** 3 * ex + x * (1 - ex);
function thrCurve(t, mid, expo) {
  const tmp = t - mid, y = tmp > 0 ? 1 - mid : tmp < 0 ? mid : 1;
  return clamp(mid + tmp * (1 - expo + expo * (tmp * tmp) / (y * y)), 0, 1);
}

// ------------------------------------------------------- drone catalog
// Physical parameters: mass kg, arm = motor-to-center m, tmax = max static thrust per motor N,
// tau = motor time constant s, kq = yaw torque/thrust ratio m, I = inertia [pitch, yaw, roll] kg·m²,
// cdTop/cdFront = drag area Cd·A m², rotorDrag = induced H-force N/(m/s), vp = prop pitch speed m/s,
// cap = battery mAh, crash = impact speed (m/s) that destroys it.
const DRONES = {

      body = `${sel('Input device', 'input', [['auto', 'Auto (last used)'], ['keyboard', 'Keyboard'], ['gamepad', 'Gamepad / RC radio'], ['touch', 'Touch screen']])}
        ${sl('Keyboard stick throw', 'kbThrow', 0.3, 1, 0.05)}
        <h3>Gamepad / RC transmitter</h3><p>${gpOn ? '🎮 Connected: <b>' + Input.gp.id + '</b>' : 'No controller detected — plug it in and press a button / move a stick.'}</p>
        <div class="row"><button class="btn sm" data-a="preset:gamepad">Gamepad preset</button><button class="btn sm" data-a="preset:rc">RC radio preset</button><button class="btn sm pri" data-a="wiz" ${gpOn ? '' : 'disabled'}>Setup wizard (map &amp; calibrate)</button></div>
        <table style="margin-top:10px"><tr><th>Function</th><th>Axis</th><th>Invert</th><th>Live</th></tr>
        ${['thr', 'yaw', 'pitch', 'roll'].map(f => `<tr><td>${{ thr: 'Throttle', yaw: 'Yaw', pitch: 'Pitch', roll: 'Roll' }[f]}</td><td><select data-s="gp.axes.${f}.i" data-num="1">${axOpts.map(([v, t]) => `<option value="${v}" ${ax[f].i == v ? 'selected' : ''}>${t}</option>`).join('')}</select></td><td><input type="checkbox" data-s="gp.axes.${f}.inv" ${ax[f].inv ? 'checked' : ''}></td><td style="width:40%"><div class="bar"><i id="lv-${f}" style="width:50%"></i></div></td></tr>`).join('')}</table>
        ${sl('Stick deadband', 'gp.deadband', 0, 0.2, 0.01)}
        <p id="rawAx" style="font:12px ui-monospace,monospace"></p>`;
    } else if (tab === 'rates') {
      const ax = (n, l) => `<h3>${l}</h3>${sl('RC rate', `rates.${n}.rc`, 0.3, 2.5, 0.01)}${sl('Super rate', `rates.${n}.sr`, 0, 0.95, 0.01)}${sl('RC expo', `rates.${n}.ex`, 0, 1, 0.01)}`;
      body = `<p>Betaflight-style curves. Expo softens the center of the stick; super rate sharpens the ends. The dots show your live stick positions.</p>
        <canvas id="rateCv" width="560" height="220" style="width:100%;max-width:560px;background:#0b1020;border-radius:10px;border:1px solid var(--line)"></canvas>
        ${ax('roll', 'Roll')}${ax('pitch', 'Pitch')}${ax('yaw', 'Yaw')}
        <h3>Self-level &amp; throttle</h3>${sl('Angle mode max tilt', 'angleMax', 20, 80, 1)}${sl('Throttle mid', 'thrMid', 0.2, 0.8, 0.01)}${sl('Throttle expo', 'thrExpo', 0, 1, 0.01)}
        ${sel('Flight mode', 'mode', [['ALT', 'ALT HOLD (beginner)'], ['ANGLE', 'ANGLE (self-level)'], ['ACRO', 'ACRO (rate)']])}
        <button class="btn sm" data-a="resetrates">Reset rates to default</button>`;
    } else if (tab === 'physics') {
      body = `${sl('Wind strength', 'wind', 0, 1, 0.05)}${sel('Battery', 'battery', [['realistic', 'Realistic capacity'], ['extended', 'Extended (3× capacity)'], ['infinite', 'Infinite']])}
        ${sel('Damage', 'damage', [['arcade', 'Arcade (tough)'], ['normal', 'Normal'], ['realistic', 'Realistic (fragile)']])}${chk('Prop wash / vortex ring', 'propwash')}`;
    } else if (tab === 'graphics') {
      body = `${sel('Quality', 'quality', [['low', 'Low (no shadows)'], ['med', 'Medium'], ['high', 'High']])}${sel('Time of day', 'tod', [['day', 'Day'], ['dusk', 'Dusk'], ['night', 'Night']])}
        ${sl('FPV field of view', 'fov', 60, 120, 1)}${sl('FPV camera uptilt', 'camTilt', 0, 50, 1)}${chk('Stick overlay', 'stickViz')}`;
    } else {
      body = `${sl('Master volume', 'vol.master', 0, 1, 0.05)}${sl('Motors', 'vol.motor', 0, 1, 0.05)}${sl('Effects', 'vol.sfx', 0, 1, 0.05)}`;
    }
    this.show(`<div class="row"><h2 class="sp" style="margin:0">Settings</h2><button class="btn sm" data-a="settingsback">← Back</button></div>
      <div class="tabs" style="margin-top:12px">${tabs.map(([k, l]) => `<button class="btn sm ${k === tab ? 'on' : ''}" data-a="tab:${k}">${l}</button>`).join('')}</div>${body}`);
    if (tab === 'rates') this.drawRates();
  },
  drawRates() {
    const cv = $('#rateCv'); if (!cv) return;
    const g = cv.getContext('2d'), W = cv.width, H = cv.height, o = Input.out;
    g.clearRect(0, 0, W, H);
    const cw = W * 0.72, maxR = Math.max(...['roll', 'pitch', 'yaw'].map(a => bfRate(1, S.rates[a])), 200);
    g.strokeStyle = 'rgba(255,255,255,.1)'; g.lineWidth = 1;
    for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(20, 10 + i * (H - 30) / 4); g.lineTo(cw, 10 + i * (H - 30) / 4); g.stroke(); }
    const cols = { roll: '#2ee6ff', pitch: '#ff3d7f', yaw: '#ffc83d' }, live = { roll: o.roll, pitch: o.pitch, yaw: o.yaw };
    g.font = '12px ui-monospace,monospace';
    ['roll', 'pitch', 'yaw'].forEach((a, k) => {
      g.strokeStyle = cols[a]; g.lineWidth = 2; g.beginPath();
      for (let i = 0; i <= 60; i++) { const x = i / 60, r = bfRate(x, S.rates[a]); const px = 20 + x * (cw - 20), py = H - 20 - r / maxR * (H - 30); i ? g.lineTo(px, py) : g.moveTo(px, py); }
      g.stroke();
      const lx = Math.abs(live[a]), lr = bfRate(lx, S.rates[a]); g.fillStyle = cols[a]; g.beginPath(); g.arc(20 + lx * (cw - 20), H - 20 - lr / maxR * (H - 30), 5, 0, 7); g.fill();
      g.fillText(`${a.toUpperCase()} ${Math.round(bfRate(1, S.rates[a]))}°/s`, cw + 14, 30 + k * 20);
    });
    g.strokeStyle = '#3dff8a'; g.beginPath();
    for (let i = 0; i <= 40; i++) { const x = i / 40, y = thrCurve(x, S.thrMid, S.thrExpo); const px = cw + 14 + x * (W - cw - 24), py = H - 20 - y * 90; i ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.stroke(); g.fillStyle = '#3dff8a'; g.fillText('THROTTLE', cw + 14, H - 118);
    g.beginPath(); g.arc(cw + 14 + o.thr * (W - cw - 24), H - 20 - thrCurve(o.thr, S.thrMid, S.thrExpo) * 90, 4, 0, 7); g.fill();
  },
  startWiz() { const a = Input.gp.axes.slice(); this.wizard = { step: 0, mins: a.slice(), maxs: a.slice(), map: {}, used: [], btn0: Input.gp.buttons.slice(), base: a.slice() }; this.renderWiz(); },
  WSTEPS: [['thr', 'Move the THROTTLE stick all the way up and down a few times, then hold it fully UP and press Next.'], ['yaw', 'Move YAW (rudder) fully left and right, then hold it fully RIGHT and press Next.'], ['pitch', 'Move PITCH (elevator) fully forward and back, then hold it fully FORWARD and press Next.'], ['roll', 'Move ROLL (aileron) fully left and right, then hold it fully RIGHT and press Next.'], ['fire', 'Press the button — or flip the switch — you want to FIRE rockets with. Or skip.']],
  renderWiz() {
    const w = this.wizard, [fn, txt] = this.WSTEPS[w.step];
    this.backFn = () => { this.wizard = null; this.settings('controls'); };
    this.show(`<h2>Controller setup ${w.step + 1}/${this.WSTEPS.length}</h2><p style="font-size:17px;color:var(--text)">${txt}</p><div id="wizAx" style="margin:14px 0"></div>
      <div class="row"><button class="btn" data-a="settingsback">Cancel</button><span class="sp"></span>${fn === 'fire' ? '<button class="btn" data-a="wizskip">Skip</button>' : '<button class="btn pri" data-a="wiznext">Next →</button>'}</div>`, true);
    this.backFn = () => { this.wizard = null; this.settings('controls'); };
  },
  wizNext(skip) {
    const w = this.wizard; if (!w) return; const [fn] = this.WSTEPS[w.step], ax = Input.gp.axes;
    if (fn !== 'fire') {
      let best = -1, br = 0;
      ax.forEach((_, i) => { if (w.used.includes(i)) return; const r = w.maxs[i] - w.mins[i]; if (r > br) { br = r; best = i; } });
      if (best < 0 || br < 0.5) { toast('No stick movement detected', 'Move the stick through its full range, then press Next', '#ff4d4d'); return; }
      const v = ax[best], inv = Math.abs(v - w.mins[best]) < Math.abs(v - w.maxs[best]);
      w.map[fn] = { i: best, inv, min: w.mins[best], max: w.maxs[best] }; w.used.push(best);
    } else if (!skip) return;
    w.step++;
    if (w.step >= this.WSTEPS.length) return this.wizDone();
    w.mins = ax.slice(); w.maxs = ax.slice(); w.btn0 = Input.gp.buttons.slice(); w.base = ax.slice();
    this.renderWiz();
  },
  wizDone() {
    const w = this.wizard;
    Object.assign(S.gp.axes, w.map); S.gp.preset = 'custom'; S.gp.deadband = 0.03; S.input = 'gamepad'; persist();
    toast('🎮 Controller calibrated', 'Check the live bars, flip Invert if a direction is backwards');
    this.wizard = null; this.settings('controls');
  },
  tick() {
    if (!this.open) return;
    const w = this.wizard, ax = Input.gp.axes;
    if (w) {
      ax.forEach((v, i) => { w.mins[i] = Math.min(w.mins[i] ?? v, v); w.maxs[i] = Math.max(w.maxs[i] ?? v, v); });
      const el = $('#wizAx');
      if (el) el.innerHTML = ax.map((v, i) => `<div class="sbar"><span>Axis ${i}${w.used.includes(i) ? ' ✓' : ''}</span><div class="bar"><i style="width:${(v + 1) * 50}%"></i></div></div>`).join('');
      if (this.WSTEPS[w.step][0] === 'fire') {
        const b = Input.gp.buttons.findIndex((v, i) => v > 0.5 && !(w.btn0[i] > 0.5));
        const a = ax.findIndex((v, i) => !w.used.includes(i) && Math.abs(v - w.base[i]) > 1);
        if (b >= 0) { S.gp.btn.fire = [{ t: 'b', i: b }]; toast('Fire bound to button ' + b); this.wizDone(); }
        else if (a >= 0) { S.gp.btn.fire = [{ t: 'a', i: a, d: Math.sign(ax[a] - w.base[a]) }]; toast('Fire bound to switch on axis ' + a); this.wizDone(); }
      }
      return;
    }
    if (this.tab === 'controls' && $('#lv-thr')) {
      const g = Input.gp; $('#lv-thr').style.width = g.thr * 100 + '%';
      for (const f of ['yaw', 'pitch', 'roll']) $('#lv-' + f).style.width = (g[f] + 1) * 50 + '%';
      const r = $('#rawAx'); if (r) r.textContent = g.axes.length ? 'Raw: ' + g.axes.map((v, i) => `A${i} ${v.toFixed(2)}`).join('  ') : '';
    }
    if (this.tab === 'rates') this.drawRates();
  }
};

// ------------------------------------------------------------ main loop
function resize() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  HUD.resize(); PSys.scale.value = innerHeight / (2 * Math.tan(camera.fov * DEG / 2));
}
function applyQuality() {
  const q = S.quality;
  renderer.setPixelRatio(Math.min(devicePixelRatio, q === 'high' ? 2 : q === 'med' ? 1.5 : 1));
  renderer.shadowMap.enabled = q !== 'low'; sun.castShadow = q !== 'low';
  const sz = q === 'high' ? 2048 : 1024; sun.shadow.mapSize.set(sz, sz);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  scene.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.needsUpdate = true; }); });
  resize();
}
const PDT = 1 / 400;
let last = performance.now(), acc = 0, silent = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  Input.altCentered = Game.mode === 'ALT';
  Input.update(dt);
  Game.handleActions();
  const playing = Game.state === 'play' && !Game.paused, q = Game.quad;
  if (playing) {
    Wind.at(q.p, Game.clock, q.wind);
    q.agl = q.p.y - Grid.roofBelow(q.p.x, q.p.y, q.p.z);
    Game.prevP.copy(q.p);
    const inp = Game.inputFor();
    acc += dt; let n = 0;
    while (acc >= PDT && n < 60) { q.step(PDT, inp, Game.mode); acc -= PDT; n++; }
    Game.update(dt);
  } else acc = 0;
  Fx.update(dt); Smoke.update(dt);
  World.updateCars(dt);
  World.warnMat.color.setHex(Math.sin(now / 1000 * 3.2) > 0.2 ? 0xff2020 : 0x220000);
  flash.intensity *= Math.exp(-dt * 18);
  Cam.update(dt);
  const f = Cam.focus || camera.position;
  sun.target.position.copy(f); sun.position.copy(f).addScaledVector(sunDir, 700); sky.position.copy(camera.position); stars.position.copy(camera.position);
  if (playing) {
    silent = false;
    const d = camera.position.distanceTo(q.p), att = Cam.mode === 'fpv' ? 1 : clamp(1 / (1 + d / 6), 0.02, 1);
    sfx.motors(q.om, q.armed || q.om[0] > 0.05, att, Cam.mode === 'los' ? 0 : _t1.subVectors(q.v, q.wind).length(), q.wash);
  } else if (!silent) { sfx.silence(); silent = true; }
  HUD.draw(dt); Touch.draw(); UI.tick(dt);
  renderer.render(scene, camera);
}
addEventListener('resize', resize);
addEventListener('gamepadconnected', e => { toast('🎮 Controller connected', e.gamepad.id.slice(0, 48)); if (UI.open && !Game.paused && Game.state === 'menu' && !UI.backFn) UI.main(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && Game.state === 'play' && !Game.paused && Game.phase !== 'done') Game.pause(true); });
if (matchMedia('(pointer:coarse)').matches) $('#rotate').classList.add('need');

World.build(); applyTOD(); HUD.init(); applyQuality(); Touch.init(); UI.init(); resize();
Game.setDrone(); Game.view.g.visible = false;
$('#boot').remove();
if (SAVE.firstRun) { SAVE.firstRun = false; persist(); UI.help(true); } else UI.main();
requestAnimationFrame(frame);
window.RC = { Game, World, S, SAVE, Input, Grid, Cam, renderer, scene, applyQuality }; // debug handle (console)
</script>
</body>
</html>
