<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>
<body>
<title>Infinite Number Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* The game's own light look, written as plain CSS so it also works offline inside the phone app. */
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; }
    body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
        background-color: #f3f4f6; /* gray-100 */
        color: #1f2937;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
    }
    button { font: inherit; cursor: pointer; }
    .card {
        width: 100%; max-width: 28rem; margin: 0 auto;
        background: #fff; border-radius: 0.75rem; padding: 1.5rem; text-align: center;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    h1 { margin: 0; font-size: 1.875rem; line-height: 2.25rem; font-weight: 700; color: #1f2937; text-wrap: balance; }
    .lead { margin: 0.5rem 0 0; color: #6b7280; }
    #mode-selector { display: flex; justify-content: center; gap: 0.5rem; margin: 1.25rem 0; }
    .score-block { margin: 1rem 0; }
    .score-label { margin: 0; font-size: 1.125rem; line-height: 1.75rem; color: #4b5563; }
    #score { margin: 0; font-size: 3rem; line-height: 1; font-weight: 700; color: #4f46e5; font-variant-numeric: tabular-nums; }
    #message-area { margin-top: 1rem; height: 2rem; font-size: 1.125rem; line-height: 1.75rem; font-weight: 500; }
    #reset-button {
        margin-top: 1rem; padding: 0.5rem 1.5rem; border: 0; border-radius: 0.5rem;
        background: #4f46e5; color: #fff; font-weight: 600;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    #reset-button:hover { background: #4338ca; }
    #reset-button:focus-visible { outline: none; box-shadow: 0 0 0 2px rgb(99 102 241 / 0.75); }

    /* small utility classes the board code uses */
    .grid { display: grid; }
    .gap-px { gap: 1px; }
    .gap-1 { gap: 0.25rem; }
    .p-1 { padding: 0.25rem; }
    .bg-gray-200 { background-color: #e5e7eb; }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded-sm { border-radius: 0.125rem; }
    .w-full { width: 100%; }

    .grid-container-wrapper {
         /* A container to constrain the grid's max width but allow it to shrink */
        width: 100%;
        max-width: 450px; /* Max size for large screens */
        margin-left: auto;
        margin-right: auto;
        touch-action: none; /* stops the page scrolling while you draw a path */
    }
    .grid-cell {
        border: 1px solid #d1d5db; /* gray-300 */
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition: all 0.2s ease-in-out;
        aspect-ratio: 1 / 1; /* This is the key for responsive squares */
    }
    .grid-cell.start {
        background-color: #34d399; /* emerald-400 */
        color: white;
        border-color: #10b981; /* emerald-600 */
    }
    .grid-cell.end {
        background-color: #fbbf24; /* amber-400 */
        color: white;
        border-color: #f59e0b; /* amber-600 */
    }
    .grid-cell.path {
        background-color: #60a5fa; /* blue-400 */
        color: white;
    }
    .grid-cell.selected {
        background-color: #a78bfa; /* violet-400 */
        color: white;
        transform: scale(1.1);
        z-index: 10;
    }
    .grid-cell.invalid {
        background-color: #f87171; /* red-400 */
        animation: shake 0.5s;
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }

    .mode-button {
        border: 0; border-radius: 0.5rem; padding: 0.5rem 1rem;
        font-size: 0.875rem; line-height: 1.25rem; font-weight: 600;
        background-color: #f3f4f6; /* gray-100 */
        color: #4b5563; /* gray-600 */
        transition: all 0.2s ease;
    }
    .mode-button:focus { outline: none; }
    .mode-button.active {
        background-color: #4f46e5; /* indigo-600 */
        color: white;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    /* double-points boost */
    .boost-pill {
        display: inline-flex; align-items: center; gap: 6px; margin-top: 0.5rem;
        padding: 3px 10px; border-radius: 999px; background: #fef3c7; color: #92400e;
        font-size: 0.8125rem; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .ad-button {
        position: fixed; z-index: 20;
        right: max(16px, env(safe-area-inset-right, 0px));
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        display: flex; align-items: center; gap: 8px; max-width: min(250px, calc(100vw - 32px));
        padding: 8px 14px 8px 10px; border-radius: 999px; border: 1px solid #c7d2fe;
        background: #fff; color: #3730a3; font-size: 0.8125rem; font-weight: 600; line-height: 1.25; text-align: left;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    .ad-button:hover:not(:disabled) { border-color: #6366f1; }
    .ad-button:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
    .ad-button:disabled { cursor: default; color: #92400e; border-color: #fde68a; background: #fffbeb; }
    .ad-button svg { flex: none; width: 20px; height: 20px; }
    .toast {
        position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
        top: calc(16px + env(safe-area-inset-top, 0px)); width: max-content; max-width: calc(100vw - 32px);
        padding: 10px 14px; border-radius: 10px; background: #1f2937; color: #fff; font-size: 0.875rem;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.2);
    }
    @media (max-width: 640px) {
        /* on phones the button sits under the card instead of covering it */
        .ad-button { position: static; margin: 12px auto 0; max-width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
        .grid-cell, .mode-button { transition: none; }
        .grid-cell.invalid { animation: none; }
    }
</style>

<div class="card">
    <h1>Infinite Number Path</h1>
    <p class="lead">Connect the green and yellow cells. The next number must be +/- 1 from the previous.</p>

    <div id="mode-selector">
        <button data-size="5" class="mode-button active">5x5</button>
        <button data-size="7" class="mode-button">7x7</button>
        <button data-size="10" class="mode-button">10x10</button>
    </div>

    <div class="score-block">
        <p class="score-label">Score</p>
        <p id="score">0</p>
        <div id="boost-pill" class="boost-pill" hidden>2× points · <span id="boost-left"></span> left</div>
    </div>

    <div id="grid-container" class="grid-container-wrapper">
        <!-- Game grid will be generated here -->
    </div>

    <div id="message-area"></div>

    <button id="reset-button">New Puzzle &amp; Reset Score</button>
</div>

<button id="ad-button" class="ad-button" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-1.5-3.5-5.5-4-5.5-1.5S10 8 12 8zm0 0c1.5-3.5 5.5-4 5.5-1.5S14 8 12 8z"/></svg>
    <span id="ad-label">Watch an ad: 2× points for 24 hours</span>
</button>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
    const gridContainer = document.getElementById('grid-container');
    const scoreEl = document.getElementById('score');
    const messageArea = document.getElementById('message-area');
    const resetButton = document.getElementById('reset-button');
    const modeSelector = document.getElementById('mode-selector');

    let GRID_SIZE = 5;
    let score = 0;
    let grid = [];
    let path = [];
    let startPoint = null;
    let endPoint = null;
    let targetPoint = null;
    let currentPath = [];
    let isDrawing = false;

    // ---- Saved progress (score, board size and the 2× boost survive closing the app) ----
    const SAVE_KEY = 'infiniteNumberPath.v1';
    const BOOST_MS = 24 * 60 * 60 * 1000;
    let boostUntil = 0;
    function loadProgress() {
        try {
            const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
            if (Number.isFinite(s.score) && s.score >= 0) score = s.score;
            if ([5, 7, 10].includes(s.size)) GRID_SIZE = s.size;
            if (Number.isFinite(s.boostUntil)) boostUntil = s.boostUntil;
        } catch (e) { /* storage unavailable: play without saving */ }
    }
    function saveProgress() {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify({ score, size: GRID_SIZE, boostUntil })); } catch (e) {}
    }
    const boostActive = () => Date.now() < boostUntil;

    /**
     * Sets the grid size and starts a new game without resetting score.
     * @param {number} size - The new grid size (5, 7, or 10).
     */
    function setGridSize(size) {
        GRID_SIZE = size;
        markActiveMode();
        saveProgress();
        newGame();
    }
    function markActiveMode() {
        document.querySelectorAll('.mode-button').forEach(btn => {
            btn.classList.remove('active');
            if (parseInt(btn.dataset.size) === GRID_SIZE) {
                btn.classList.add('active');
            }
        });
    }

    /**
     * Initializes and starts a new game.
     */
    function newGame() {
        grid = [];
        path = [];
        currentPath = [];
        isDrawing = false;
        targetPoint = null;
        generateGrid();
        renderGrid();
        messageArea.textContent = '';
    }

    /**
     * Generates the grid with a valid, single-stroke path.
     */
    function generateGrid() {
        grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));
        let pathLength = Math.floor(GRID_SIZE * GRID_SIZE * (0.5 + Math.random() * 0.2));
        if (pathLength < GRID_SIZE) pathLength = GRID_SIZE;

        let attempts = 0;
        path = [];
        while (path.length < pathLength && attempts < 1000) {
            path = [];
            let visited = new Set();
            let startX = Math.floor(Math.random() * GRID_SIZE);
            let startY = Math.floor(Math.random() * GRID_SIZE);
            let currentValue = Math.floor(Math.random() * 10) + 1;

            let currentPos = { x: startX, y: startY };
            path.push({ ...currentPos, value: currentValue });
            visited.add(`${currentPos.x},${currentPos.y}`);

            for (let i = 0; i < pathLength - 1; i++) {
                let neighbors = getUnvisitedNeighbors(currentPos, visited);
                if (neighbors.length === 0) break;

                let nextPos = neighbors[Math.floor(Math.random() * neighbors.length)];
                let valueChange = Math.random() > 0.5 ? 1 : -1;
                currentValue += valueChange;
                if (currentValue < 1) currentValue = 2;

                currentPos = nextPos;
                path.push({ ...currentPos, value: currentValue });
                visited.add(`${currentPos.x},${currentPos.y}`);
            }
            attempts++;
        }

        if (path.length < 2) {
            newGame(); return;
        }

        path.forEach(p => { grid[p.y][p.x] = p.value; });
        startPoint = path[0];
        endPoint = path[path.length - 1];

        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                if (grid[y][x] === null) {
                    let isDistractor = true;
                    let randomValue;
                    while(isDistractor) {
                         randomValue = Math.floor(Math.random() * 20) + 1;
                         const neighbors = [{x:x-1, y}, {x:x+1, y}, {x, y:y-1}, {x, y:y+1}];
                         let connects = false;
                         for(const n of neighbors) {
                             if(n.x >=0 && n.x < GRID_SIZE && n.y >= 0 && n.y < GRID_SIZE && grid[n.y][n.x] !== null) {
                                 if(Math.abs(grid[n.y][n.x] - randomValue) === 1) {
                                     connects = true;
                                     break;
                                 }
                             }
                         }
                         if(!connects) { isDistractor = false; }
                    }
                    grid[y][x] = randomValue;
                }
            }
        }
    }

    function getUnvisitedNeighbors(pos, visited) {
        const neighbors = [];
        const directions = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];
        for (const dir of directions) {
            const newX = pos.x + dir.x;
            const newY = pos.y + dir.y;
            if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE && !visited.has(`${newX},${newY}`)) {
                neighbors.push({ x: newX, y: newY });
            }
        }
        return neighbors;
    }

    function renderGrid() {
        gridContainer.innerHTML = '';
        const gridEl = document.createElement('div');
        const gap = GRID_SIZE === 10 ? 'gap-px' : 'gap-1';
        gridEl.className = `grid ${gap} p-1 bg-gray-200 rounded-lg w-full`;
        gridEl.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`;

        let fontSize;
        if (GRID_SIZE === 5) { fontSize = 'clamp(1rem, 4vw, 1.5rem)'; }
        else if (GRID_SIZE === 7) { fontSize = 'clamp(0.8rem, 3vw, 1.2rem)'; }
        else { fontSize = 'clamp(0.6rem, 2.5vw, 1rem)'; }

        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                const cell = document.createElement('div');
                cell.dataset.x = x; cell.dataset.y = y; cell.dataset.value = grid[y][x];
                cell.classList.add('grid-cell', 'rounded-sm');
                cell.textContent = grid[y][x];
                cell.style.fontSize = fontSize;

                if (x === startPoint.x && y === startPoint.y) cell.classList.add('start');
                if (x === endPoint.x && y === endPoint.y) cell.classList.add('end');

                cell.addEventListener('mousedown', handleInteractionStart);
                cell.addEventListener('touchstart', handleInteractionStart);
                cell.addEventListener('mouseenter', handleInteractionMove);
                cell.addEventListener('touchmove', handleInteractionMove);

                gridEl.appendChild(cell);
            }
        }
        gridContainer.appendChild(gridEl);
        document.addEventListener('mouseup', handleInteractionEnd, { passive: false });
        document.addEventListener('touchend', handleInteractionEnd, { passive: false });
    }

    function handleInteractionStart(e) {
        e.preventDefault();
        const cell = getCellFromEvent(e);
        if (!cell || isDrawing) return;
        const x = parseInt(cell.dataset.x); const y = parseInt(cell.dataset.y);
        const isStartNode = (x === startPoint.x && y === startPoint.y);
        const isEndNode = (x === endPoint.x && y === endPoint.y);
        if (isStartNode || isEndNode) {
            isDrawing = true;
            targetPoint = isStartNode ? endPoint : startPoint;
            currentPath = [{ x, y, value: grid[y][x] }];
            cell.classList.add('selected');
        }
    }

    function handleInteractionMove(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const cell = getCellFromEvent(e);
        if (!cell || currentPath.some(p => p.x === parseInt(cell.dataset.x) && p.y === parseInt(cell.dataset.y))) return;
        const x = parseInt(cell.dataset.x); const y = parseInt(cell.dataset.y);
        const lastPoint = currentPath[currentPath.length - 1];
        const isAdjacent = Math.abs(lastPoint.x - x) + Math.abs(lastPoint.y - y) === 1;
        const isValueCorrect = Math.abs(lastPoint.value - grid[y][x]) === 1;

        if (isAdjacent && isValueCorrect) {
            currentPath.push({ x, y, value: grid[y][x] });
            cell.classList.add('selected');
            if (x === targetPoint.x && y === targetPoint.y) win();
        } else if (isAdjacent) {
            cell.classList.add('invalid');
            setTimeout(() => cell.classList.remove('invalid'), 500);
            resetCurrentPath();
        }
    }

    function handleInteractionEnd(e) {
        if (isDrawing) resetCurrentPath();
    }

    function resetCurrentPath() {
        isDrawing = false;
        targetPoint = null;
        document.querySelectorAll('.grid-cell.selected').forEach(c => c.classList.remove('selected'));
        currentPath = [];
    }

    function win() {
        isDrawing = false;
        targetPoint = null;

        // Score is the number of cells between the start and end points, doubled while a boost is active.
        const basePoints = Math.max(0, currentPath.length - 2);
        const boosted = boostActive();
        const pointsAwarded = boosted ? basePoints * 2 : basePoints;
        score += pointsAwarded;
        saveProgress();

        scoreEl.textContent = score;
        messageArea.textContent = `Success! +${pointsAwarded} points${boosted ? ' (2× boost)' : ''}`;
        messageArea.style.color = '#10b981';

        currentPath.forEach(p => {
            const cell = document.querySelector(`[data-x='${p.x}'][data-y='${p.y}']`);
            if(cell) { cell.classList.remove('selected'); cell.classList.add('path'); }
        });
        setTimeout(newGame, 1100); // Slightly longer delay to read the points message
    }

    function getCellFromEvent(e) {
         if (e.touches && e.touches.length > 0) {
            const touch = e.touches[0];
            return document.elementFromPoint(touch.clientX, touch.clientY);
        }
        return e.target.closest('.grid-cell');
    }

    // --- Event Listeners ---
    modeSelector.addEventListener('click', (e) => {
        if (e.target.matches('.mode-button')) {
            const newSize = parseInt(e.target.dataset.size);
            if (newSize !== GRID_SIZE) {
                setGridSize(newSize);
            }
        }
    });

    resetButton.addEventListener('click', () => {
        score = 0;
        scoreEl.textContent = score;
        saveProgress();
        newGame();
    });

    // --- Optional rewarded ad: 2× points for 24 hours (phone app only) ---
    // The phone app replaces these settings from ad-settings.json (see the app folder).
    const AD = Object.assign({
        testing: true,
        androidRewardedAdUnitId: 'ca-app-pub-3940256099942544/5224354917',
        iosRewardedAdUnitId: 'ca-app-pub-3940256099942544/1712485313',
        buttonLabel: 'Watch an ad: 2× points for 24 hours',
    }, window.INP_AD_SETTINGS || {});
    const adButton = document.getElementById('ad-button');
    const adLabel = document.getElementById('ad-label');
    const boostPill = document.getElementById('boost-pill');
    const boostLeft = document.getElementById('boost-left');
    const toastEl = document.getElementById('toast');
    let adPlugin = null, adReady = false, adBusy = false, toastTimer = 0;

    function toast(msg) {
        toastEl.textContent = msg; toastEl.hidden = false;
        clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3800);
    }
    function timeLeft(ms) {
        const mins = Math.max(1, Math.ceil(ms / 60000)), h = Math.floor(mins / 60), m = mins % 60;
        return h ? `${h} h ${m} min` : `${m} min`;
    }
    function updateBoostUI() {
        const on = boostActive();
        boostPill.hidden = !on;
        if (on) boostLeft.textContent = timeLeft(boostUntil - Date.now());
        if (adBusy) return;
        adButton.disabled = on;
        adLabel.textContent = on ? `2× points active · ${timeLeft(boostUntil - Date.now())} left` : AD.buttonLabel;
    }
    function nativeAdMob() {
        try {
            const cap = window.Capacitor;
            if (!cap || typeof cap.isNativePlatform !== 'function' || !cap.isNativePlatform()) return null;
            if (!adPlugin) adPlugin = typeof cap.registerPlugin === 'function' ? cap.registerPlugin('AdMob') : (cap.Plugins && cap.Plugins.AdMob) || null;
            return adPlugin;
        } catch (e) { return null; }
    }
    async function prepareAds(A) {
        if (adReady) return true;
        const info = await A.requestConsentInfo();
        let can = info.canRequestAds !== false;
        if (info.isConsentFormAvailable && info.status === 'REQUIRED') { const after = await A.showConsentForm(); can = !after || after.canRequestAds !== false; }
        if (!can) return false;
        await A.initialize({ initializeForTesting: !!AD.testing });
        adReady = true; return true;
    }
    async function watchAd() {
        if (boostActive()) return;
        const A = nativeAdMob();
        if (!A) { toast('Ads only play in the phone app version of this game.'); return; }
        if (adBusy) return;
        adBusy = true; adButton.disabled = true; adLabel.textContent = 'Loading ad…';
        let rewarded = false; const handles = [];
        const grant = () => {
            if (rewarded) return; rewarded = true;
            boostUntil = Date.now() + BOOST_MS; saveProgress();
            toast('Thanks for watching! Your points are doubled for the next 24 hours.');
        };
        try {
            if (!(await prepareAds(A))) throw new Error('no consent');
            try { handles.push(await A.addListener('onRewardedVideoAdReward', grant)); } catch (e) {}
            const platform = window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : 'android';
            await A.prepareRewardVideoAd({ adId: platform === 'ios' ? AD.iosRewardedAdUnitId : AD.androidRewardedAdUnitId, isTesting: !!AD.testing });
            const item = await A.showRewardVideoAd();
            if (item && (item.amount > 0 || item.type)) grant();
        } catch (e) {
            if (!rewarded) toast('No ad is available right now. Please try again later.');
        }
        for (const hd of handles) { try { hd.remove(); } catch (e) {} }
        adBusy = false; updateBoostUI();
    }
    adButton.addEventListener('click', watchAd);
    setInterval(updateBoostUI, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) updateBoostUI(); });

    // Initial game start
    loadProgress();
    markActiveMode();
    scoreEl.textContent = score;
    updateBoostUI();
    newGame();
</script>

</body>
</html>
