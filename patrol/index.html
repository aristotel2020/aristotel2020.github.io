<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Patrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&display=swap">
<style>
:root{
  --ink:#fff1d6; --ink-dim:rgba(255,236,210,.62); --ink-faint:rgba(255,236,210,.28);
  --night:#1a1424; --gold:#ffd38a; --rose:#e8605a; --plum:#3b2a55; --amber:#ffb347;
  --pixel:'Press Start 2P', ui-monospace, monospace;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none}
canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{pointer-events:none}
body.mouse #gl{cursor:none}
.logo{font-family:var(--pixel);font-size:48px;letter-spacing:8px;color:var(--gold);text-shadow:4px 4px 0 var(--rose),8px 8px 0 var(--plum);line-height:1}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:var(--night);z-index:20;transition:opacity .9s steps(6)}
#loader.gone{opacity:0;pointer-events:none}
#bar{width:min(384px,72vw);height:24px;border:4px solid var(--gold);padding:4px;background:#241b32}
#bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--amber) 0 8px,transparent 8px 12px)}
#stage{font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-dim);min-height:1em}
#title{position:fixed;left:0;right:0;top:9vh;display:flex;flex-direction:column;align-items:center;gap:20px;pointer-events:none;z-index:10;transition:opacity 1.4s steps(8)}
#title.gone{opacity:0}
#title[hidden]{display:none}
#title .logo{font-size:clamp(32px,8vw,80px)}
#title .sub,#title .go{font-family:var(--mono);text-transform:uppercase;color:var(--ink);background:rgba(26,20,36,.55);padding:5px 12px 5px calc(12px + .5em)}
#title .sub{font-size:13px;font-weight:600;letter-spacing:.5em}
#title .go{font-size:12px;letter-spacing:.24em;padding-left:calc(12px + .24em);margin-top:6px;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#strip{position:fixed;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink-dim);background:rgba(18,12,26,.6);z-index:5;white-space:nowrap;padding:0 10px;pointer-events:none;overflow:hidden}
#strip b{color:var(--ink);font-weight:600}
#strip .sep{color:var(--ink-faint)}
#vname{color:var(--gold);font-weight:600}
#msl{display:inline-flex;gap:3px;align-items:center}
#msl i{width:5px;height:10px;background:var(--amber);display:inline-block}
#msl i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-faint)}
#snd{pointer-events:auto;font:inherit;font-weight:600;color:var(--ink-dim);background:transparent;border:1px solid var(--ink-faint);padding:1px 8px;cursor:pointer;letter-spacing:.08em;border-radius:0}
#snd:hover{color:var(--ink);border-color:var(--ink-dim)}
#snd.on{color:#1a1424;background:var(--gold);border-color:var(--gold)}
#snd:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.t-only{display:none}
body.touch .m-only{display:none}
body.touch .t-only{display:inline}
#touch{display:none}
body.touch #touch{display:block}
#touch button{position:fixed;width:64px;height:64px;font-family:var(--pixel);font-size:8px;letter-spacing:1px;color:var(--ink);background:rgba(26,20,36,.5);border:3px solid rgba(255,211,138,.7);border-radius:0;box-shadow:4px 4px 0 rgba(10,6,16,.4);touch-action:none;padding:0;z-index:6}
#touch button.down{background:rgba(255,211,138,.88);color:#1a1424}
#tFire{right:16px;bottom:40px;width:80px!important;height:80px!important;border-color:rgba(232,96,90,.9)!important}
#tBoost{right:108px;bottom:40px}
#tRoll{right:108px;bottom:116px}
#tView{left:16px;bottom:40px}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;color:var(--ink);background:var(--night);z-index:30;padding:24px;text-align:center}
#err[hidden]{display:none}
@media (max-width:760px){ #strip .wide{display:none} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="loader"><div class="logo">PATROL</div><div id="bar"><i></i></div><div id="stage">raising hills</div></div>
<div id="title" hidden><div class="logo">PATROL</div><div class="sub">lake country &middot; last light</div><div class="go"><span class="m-only">move the mouse to take the stick</span><span class="t-only">touch and drag to take the stick</span></div></div>
<div id="strip">
  <span class="m-only"><b>MOUSE</b> steer</span><span class="t-only"><b>DRAG</b> steer</span><span class="sep">&middot;</span>
  <span class="m-only wide"><b>CLICK</b> roll</span><span class="sep m-only wide">&middot;</span>
  <span class="m-only wide"><b>HOLD</b> burner</span><span class="sep m-only wide">&middot;</span>
  <span class="m-only"><b>R-CLICK / F</b> missile</span><span class="sep m-only">&middot;</span>
  <span><b class="m-only">SPACE</b> view <span id="vname">CHASE</span></span><span class="sep">&middot;</span>
  <span id="msl" aria-label="missiles ready"><i></i><i></i><i></i><i></i></span><span class="sep">&middot;</span>
  <button id="snd" type="button" aria-pressed="false">SOUND OFF</button>
</div>
<div id="touch">
  <button id="tView" type="button">VIEW</button>
  <button id="tRoll" type="button">ROLL</button>
  <button id="tBoost" type="button">BURN</button>
  <button id="tFire" type="button">FIRE</button>
</div>
<div id="err" hidden></div>

<script type="text/plain" id="worker-src">
'use strict';
let N = 2048, TEXEL = 6, SEED = 7, TANEL = 0.158, CN = 512;
const GX = new Float64Array(16), GY = new Float64Array(16);
for (let i = 0; i < 16; i++) { const a = (i + 0.5) / 16 * Math.PI * 2; GX[i] = Math.cos(a); GY[i] = Math.sin(a); }
function hash(x, y, s) {
  let h = Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(s, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return h ^ (h >>> 16);
}
// periodic gradient noise: P lattice cells per period, result roughly in [-1, 1]
function gn(x, y, P, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const fx = x - xi, fy = y - yi;
  let x0 = xi % P; if (x0 < 0) x0 += P; let x1 = x0 + 1; if (x1 >= P) x1 -= P;
  let y0 = yi % P; if (y0 < 0) y0 += P; let y1 = y0 + 1; if (y1 >= P) y1 -= P;
  const a = hash(x0, y0, s) & 15, b = hash(x1, y0, s) & 15, c = hash(x0, y1, s) & 15, d = hash(x1, y1, s) & 15;
  const va = GX[a] * fx + GY[a] * fy;
  const vb = GX[b] * (fx - 1) + GY[b] * fy;
  const vc = GX[c] * fx + GY[c] * (fy - 1);
  const vd = GX[d] * (fx - 1) + GY[d] * (fy - 1);
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const ab = va + (vb - va) * u, cd = vc + (vd - vc) * u;
  return (ab + (cd - ab) * v) * 1.5;
}
function fbm(u, v, f, oct, s) {
  let sum = 0, amp = 1, nrm = 0;
  for (let o = 0; o < oct; o++) { sum += amp * gn(u * f, v * f, f, s + o * 1013); nrm += amp; amp *= 0.5; f *= 2; }
  return sum / nrm;
}
function ridged(u, v, f, oct, s) {
  let sum = 0, amp = 0.5, w = 1, nrm = 0;
  for (let o = 0; o < oct; o++) {
    let n = 1 - Math.abs(gn(u * f, v * f, f, s + o * 977));
    if (n < 0) n = 0;
    n = n * n * w;
    w = n * 1.7; if (w > 1) w = 1;
    sum += n * amp; nrm += amp;

  }

function sm(a, b, x) { let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
const OFF = 5;
function terrain(u, v, S, out) {
  const wx = fbm(u, v, 3, 4, S + 11) * 0.06, wy = fbm(u, v, 3, 4, S + 23) * 0.06;
  const U = u + wx, V = v + wy;
  const base = fbm(U, V, 4, 6, S + 101);
  const hills = fbm(U, V, 24, 4, S + 202);
  const mt = sm(0.08, 0.42, fbm(u, v, 2, 3, S + 303));
  const mid = fbm(U, V, 10, 3, S + 151);

  h = h > 0 ? h * h / (h + 16) : h * 1.15;
  if (mt > 0) h += mt * Math.pow(ridged(U, V, 5, 6, S + 404), 1.6) * 620;
  const fr = fbm(u, v, 16, 4, S + 505) + 0.45 * fbm(u, v, 96, 2, S + 515);
  const forest = sm(-0.04, 0.14, fr) * (1 - sm(200, 290, h)) * sm(0.8, 3.5, h);
  out[0] = h;
  out[1] = forest;
  out[2] = fbm(u, v, 8, 3, S + 707) * 1.1 + 0.5;   // autumn hue patches
  out[3] = fbm(u, v, 40, 2, S + 808) * 1.3 + 0.5;  // meadow variation
  out[4] = fbm(u, v, 256, 1, S + 909) * 0.9 + 0.5; // fine jitter

const b255 = (x) => { x = Math.round(x * 255); return x < 0 ? 0 : x > 255 ? 255 : x; };
function stageA(y0, y1) {
  const rows = y1 - y0, S = SEED * 7919;

      H[i] = o[0];
      M[i * 4] = b255(o[1]); M[i * 4 + 1] = b255(o[2]); M[i * 4 + 2] = b255(o[3]); M[i * 4 + 3] = b255(o[4]);

    if (++done === 8) { postMessage({ type: 'p', n: done }); done = 0; }
  }

// band = rows [y0-M, y1+M) of the height field (wrapped by the caller)
function stageB(y0, y1, band, M) {
  const rows = y1 - y0, BR = rows + 2 * M, R = 6, W = 2 * R + 1;

    for (let x = 0; x < N; x++) {

    let occ = -1e9;

      for (let x = 0; x < N; x++) {
        const s = band[row + x] > 0 ? band[row + x] : 0;
        occ -= drop;

        if (s > occ) occ = s;

    for (let x = 0; x < N; x++) {

      const dz = (band[row + N + x] - band[row - N + x]) * inv2T;
      const il = 1 / Math.sqrt(dx * dx + dz * dz + 1);
      let acc = 0;
      for (let k = -R; k <= R; k++) acc += hb[(j + k) * N + x];

      out[o] = b255(-dx * il * 0.5 + 0.5);
      out[o + 1] = b255(-dz * il * 0.5 + 0.5);
      out[o + 2] = b255(sh[x]);
      out[o + 3] = b255(0.55 + (h - blur) * 0.035);

}

  const out = new Uint8Array(CN * CN), S = SEED * 7919 + 5000;
  for (let y = 0; y < CN; y++) {

      const u = x / CN, v = y / CN;
      const d = fbm(u, v, 7, 4, S + 1) * 0.68 + fbm(u, v, 28, 3, S + 2) * 0.32;
      out[y * CN + x] = b255(0.5 + d * 0.9);

  const m = e.data;
  try {
    if (m.type === 'init') { N = m.N; TEXEL = m.TEXEL; SEED = m.SEED; TANEL = m.TANEL; CN = m.CN; return; }
    if (m.type === 'A') { const r = stageA(m.y0, m.y1); postMessage({ type: 'A', y0: m.y0, y1: m.y1, H: r.H, M: r.M }, [r.H.buffer, r.M.buffer]); return; }
    if (m.type === 'B') { const r = stageB(m.y0, m.y1, m.band, m.M); postMessage({ type: 'B', y0: m.y0, y1: m.y1, O: r }, [r.buffer]); return; }
    if (m.type === 'C') { const r = stageC(); postMessage({ type: 'C', C: r }, [r.buffer]); return; }
  } catch (err) { postMessage({ type: 'error', msg: String(err && err.stack || err) }); }
};
</script>

<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const errors = [];
window.__patrolErrors = errors;
window.addEventListener('error', (e) => { errors.push(String(e.message || e)); });
window.addEventListener('unhandledrejection', (e) => { errors.push('promise: ' + String((e.reason && e.reason.message) || e.reason)); });

// ------------------------------------------------------------------ settings
const Q = new URLSearchParams(location.search);
const SEED = (parseInt(Q.get('seed'), 10) || 7) >>> 0;
const FIXQ = Q.has('q') ? Math.max(0, Math.min(6, parseInt(Q.get('q'), 10) || 0)) : -1;
const N = 2048, TEXEL = 6, WORLD = N * TEXEL;          // terrain tile: 12.3 km, 6 m texels
const CN = 512, CWORLD = 8192;                           // cloud density tile
const DEG = Math.PI / 180;
const SUN_EL = 9 * DEG;
const SUN = [-Math.cos(SUN_EL), Math.sin(SUN_EL), 0];    // low sun in the west
const SHD = norm3([-0.5, 0.86, 0.1]);                    // steeper light used for jet / cloud shadows so they stay in view
const LJET = norm3([-0.74, 0.62, 0.18]);
const CB = 380, CH = 150, CTHR = 0.6;                    // cloud base, dome height, density threshold
const MAXD = 9000, NEAR = 1.0, FAR = 20000;

// ------------------------------------------------------------------ math
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function lerp(a, b, t) { return a + (b - a) * t; }

function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

function madd(a, b, s) { return [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s]; }

function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }

function basis(psi, theta, roll) {

function basisFromQuat(q) {

  const R = [1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w)];
  const U = [2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w)];

function slerp(a, b, t) {
  let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
  let c = b;
  if (d < 0) { d = -d; c = [-b[0], -b[1], -b[2], -b[3]]; }
  let wa, wb;
  if (d > 0.9995) { wa = 1 - t; wb = t; }
  else { const th = Math.acos(d), s = Math.sin(th); wa = Math.sin((1 - t) * th) / s; wb = Math.sin(t * th) / s; }
  const r = [a[0] * wa + c[0] * wb, a[1] * wa + c[1] * wb, a[2] * wa + c[2] * wb, a[3] * wa + c[3] * wb];
  const l = Math.hypot(r[0], r[1], r[2], r[3]) || 1;
  return [r[0] / l, r[1] / l, r[2] / l, r[3] / l];
}

// ------------------------------------------------------------------ palette
const PAL = {
  SKYS: ['#ffd88f', '#fcbd8a', '#eea195', '#cf8ca9', '#a17fb3', '#7369a6', '#4f4f8f'],
  SKYA: ['#c3abcf', '#a998c6', '#8f86ba', '#7875ad', '#6365a0', '#525691', '#43487f'],
  HAZE: ['#a497c3', '#bd9fc0', '#d8a8b0', '#eeb999', '#fbcd8c'],
  WATER: ['#a3e8d4', '#61c9be', '#3299a5', '#236b91', '#1d4370', '#192c55'],
  WATER_SH: ['#78a9b8', '#4e8a9f', '#326888', '#284b74', '#22335a', '#1b2448'],
  SAND: ['#5d4f6e', '#8e7479', '#c49e7e', '#e7c493', '#fbe1ac'],
  MEADOW: ['#4c4867', '#6f6c69', '#a39f6b', '#d1c47d', '#f2e3a2'],
  MEADOW2: ['#494a66', '#646e61', '#8e9963', '#bcbe7b', '#e3dd9c'],
  FORANGE: ['#4a2842', '#7c3a3c', '#b6522e', '#e77f30', '#ffb252'],
  FCRIM: ['#3c1c3d', '#63243e', '#962c3a', '#cd4142', '#f2705c'],
  FGOLD: ['#4b3a4c', '#7d5a3c', '#b8892e', '#e7b937', '#ffe072'],
  CONIFER: ['#1b2033', '#232f3b', '#2c4745', '#3d6150', '#577a5e'],
  ROCK: ['#3a3656', '#564f6e', '#79708d', '#a497aa', '#cbb9be'],
  SNOW: ['#7b77a8', '#a29ec8', '#d3c8dd', '#f6e0d2', '#fff6ea'],
  CLOUD: ['#7a6cab', '#a08bc1', '#d2a5bf', '#f5c9ab', '#fff5e4'],
  SCORCH: ['#1d1520', '#2d1f26', '#46302f'],
};
const COLS = {
  SUNC: '#fff8dc', SUNR: '#ffe5a0', STREAK_S: '#ffe2b4', STREAK_A: '#ddc6e2',
  CLOUDLO: '#5d5492', GLITW: '#ffffff', GLITG: '#ffd987', FOAMW: '#f4fbf6', FOAMP: '#cfeee7', EMBER0: '#ff5a2a', EMBER1: '#ffc24a',
};
function v3s(c) { const v = hex(c); return 'vec3(' + v.map((x) => x.toFixed(4)).join(',') + ')'; }
function glslPalette() {
  let s = '';
  for (const k in PAL) {
    const a = PAL[k], n = a.length;
    s += 'const vec3 ' + k + '[' + n + '] = vec3[' + n + '](' + a.map(v3s).join(',') + ');\n';
    // ordered dithering only in a band around each tone boundary, so flat areas stay clean
    s += 'vec3 r_' + k + '(float t){ int i = int(clamp(floor(t*' + (n - 1).toFixed(1) + ' + 0.5 + (bay - 0.5)*0.7), 0.0, ' + (n - 1).toFixed(1) + ')); return ' + k + '[i]; }\n';
  }
  for (const k in COLS) s += 'const vec3 ' + k + ' = ' + v3s(COLS[k]) + ';\n';
  return s;
}

// ------------------------------------------------------------------ canvases & GL
const glc = $('gl'), uic = $('ui');
const gl = glc.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
const ctx2 = uic.getContext('2d');
if (!gl) { fail('Patrol needs a browser with WebGL2.'); return; }

const DEFS = [
  '#define WORLD ' + WORLD.toFixed(1), '#define TEXEL ' + TEXEL.toFixed(1), '#define CWORLD ' + CWORLD.toFixed(1),
  '#define CB ' + CB.toFixed(1), '#define CH ' + CH.toFixed(1), '#define CTHR ' + CTHR.toFixed(3),
  '#define MAXD ' + MAXD.toFixed(1), '#define MAXC 7000.0', '#define SUN_R 0.056',
].join('\n');
const BAYER_GLSL = 'const float BAYER[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);\n' +
  'float bayerAt(vec2 fc){ ivec2 q = ivec2(fc) & 3; return (BAYER[q.x + q.y*4] + 0.5)/16.0; }\n';

const VS_FULL = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p*2.0 - 1.0, 0.0, 1.0); }`;

const FS_SCENE = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
${DEFS}
uniform sampler2D uH;
uniform sampler2D uN;
uniform sampler2D uM;
uniform sampler2D uC;
uniform sampler2D uJS;
uniform vec2 uRes;
uniform vec3 uCamPos;
uniform mat3 uCamRot;
uniform vec3 uProj;
uniform float uTime;
uniform vec3 uSun;
uniform vec3 uShDir;
uniform vec2 uCloudOff;
uniform float uMaxH;
uniform float uPanelY;
uniform vec3 uJetPos;
uniform vec3 uJSU;
uniform vec3 uJSV;
uniform vec4 uImp[8];
uniform vec4 uCut;
uniform vec2 uNF;
uniform float uPxAng;
uniform float uSteps;
out vec4 oCol;
float bay;
${BAYER_GLSL}
${glslPalette()}

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y)*p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0 - 2.0*f);
  float a = hash12(i), b = hash12(i + vec2(1.0, 0.0)), c = hash12(i + vec2(0.0, 1.0)), d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float terrH(vec2 xz, float lod){ return textureLod(uH, xz*(1.0/WORLD), lod).r; }

// ---- clouds: a slab of puffy domes over a tiling density map
float cloudC(vec2 xz){ float d = textureLod(uC, (xz + uCloudOff)*(1.0/CWORLD), 0.0).r; return (d - CTHR)/(1.0 - CTHR); }
float cloudTop(vec2 xz, float c){
  float puff = vnoise(xz*(1.0/62.0))*0.75 + vnoise(xz*(1.0/24.0) + 3.1)*0.25;
  return CB + CH*sqrt(c)*(0.58 + 0.5*puff*puff*(3.0 - 2.0*puff));
}
bool inCloud(vec3 p){
  float c = cloudC(p.xz);
  if (c <= 0.0) return false;
  if (p.y < CB - 14.0*sqrt(c)) return false;
  return p.y < cloudTop(p.xz, c);
}
float jetShadow(vec3 p){
  vec3 d = p - uJetPos;
  if (dot(d, uShDir) > 0.0) return 1.0;
  vec2 uv = vec2(dot(d, uJSU), dot(d, uJSV)) + 0.5;
  if (uv.x <= 0.0 || uv.y <= 0.0 || uv.x >= 1.0 || uv.y >= 1.0) return 1.0;
  return 1.0 - texture(uJS, uv).r;
}
float dynShadow(vec3 p){
  float s = 1.0;
  float tc = (CB + 25.0 - p.y)/uShDir.y;
  if (tc > 0.0) { float c = cloudC(p.xz + uShDir.xz*tc); s *= 1.0 - clamp(c*7.0, 0.0, 1.0); }
  return s*jetShadow(p);
}

// ---- sky & haze
vec3 hazeCol(vec3 rd){
  vec2 h = rd.xz; float l = length(h);
  float s = l > 1e-4 ? dot(h/l, normalize(uSun.xz))*0.5 + 0.5 : 0.5;
  return r_HAZE(s*s);
}
vec3 skyCol(vec3 rd, bool withSun){
  float el = rd.y;
  if (el < 0.0) return hazeCol(rd);
  vec2 h = rd.xz; float l = max(length(h), 1e-4);
  float s = dot(h/l, normalize(uSun.xz))*0.5 + 0.5;
  float ang = acos(clamp(dot(rd, uSun), -1.0, 1.0));
  float b = sqrt(el)*6.6;
  float glow = max(0.0, 1.0 - ang/0.6);
  b -= glow*glow*2.8;
  int bi = int(clamp(floor(b + 0.5 + (bay - 0.5)*0.85), 0.0, 6.0));
  int ai = int(clamp(floor(s*s*s*2.0 + 0.5 + (bay - 0.5)*0.85), 0.0, 2.0));
  vec3 c = ai == 0 ? SKYA[bi] : (ai == 1 ? mix(SKYA[bi], SKYS[bi], 0.5) : SKYS[bi]);
  if (el > 0.012 && el < 0.62) {
    vec2 q = rd.xz/(el + 0.05);
    q = mat2(0.93, 0.36, -0.36, 0.93)*q;
    float n = vnoise(vec2(q.x*0.7, q.y*7.0) + vec2(uTime*0.004, 0.0));
    float m = vnoise(q*0.9 + 13.0);
    float st = n*smoothstep(0.45, 0.85, m);
    float thr = 0.58 + el*0.45;
    if (st > thr) c = mix(c, s > 0.55 ? STREAK_S : STREAK_A, (st > thr + 0.06 || bay > 0.5) ? 0.8 : 0.45);
  }
  if (withSun) {
    if (ang < SUN_R) c = ang < SUN_R*0.8 ? SUNC : SUNR;
    else if (ang < SUN_R*1.4 && bay > 0.5) c = mix(c, SUNR, 0.6);
  }
  return c;
}
vec3 fogit(vec3 c, vec3 rd, float t, float py){
  float avgY = max(0.0, 0.5*(uCamPos.y + py));
  float od = t*0.00034*exp(-avgY/1000.0);
  float f = 1.0 - exp(-od);
  f = max(f, smoothstep(MAXD*0.55, MAXD, t));
  float fq = floor(clamp(f, 0.0, 1.0)*6.0 + bay)/6.0;
  return mix(c, hazeCol(rd), fq);
}

// ---- water
vec3 shadeWater(vec3 p, vec3 rd, float h, float lt, float pxm){
  float depth = -h;
  bool lit = lt > bay;
  float dv = clamp(log2(1.0 + depth*0.5)/log2(1.0 + 45.0*0.5), 0.0, 1.0);
  int wi = int(clamp(floor(dv*5.0 + 0.5 + (bay - 0.5)*0.75), 0.0, 5.0));
  vec3 c = lit ? WATER[wi] : WATER_SH[wi];
  vec2 wp = p.xz;
  float w1 = vnoise(wp*0.08 + vec2(uTime*0.30, uTime*0.17));
  float w2 = vnoise(wp*0.21 + vec2(-uTime*0.45, uTime*0.28));
  vec3 n = normalize(vec3((w1 - 0.5)*0.26 + (w2 - 0.5)*0.16, 1.0, (w2 - 0.5)*0.26 - (w1 - 0.5)*0.12));
  vec3 rr = reflect(rd, n);
  float fres = pow(1.0 - clamp(-rd.y, 0.0, 1.0), 4.0);
  if (fres > 0.05) {
    vec3 sc = skyCol(vec3(rr.x, max(rr.y, 0.0), rr.z), false);
    float fq = floor(clamp(fres*1.1, 0.0, 0.8)*4.0 + bay)/4.0;
    c = mix(c, sc, fq*(lit ? 1.0 : 0.55));
  }
  if (lit) {
    // sparkle cells never get smaller than ~one pixel, nor much bigger, whatever the distance
    float cell = max(0.35, pxm*1.15);
    float sp = dot(rr, uSun);
    if (sp > 0.965) {
      float sk = hash13(vec3(floor(wp/cell), floor(uTime*6.0)));
      if (sk > 1.0 - (sp - 0.965)*24.0) c = sp > 0.993 ? GLITW : GLITG;
    }
    vec2 gc = floor(wp/max(0.45, pxm*1.3));
    float g = hash13(vec3(gc, floor(uTime*2.5 + hash12(gc)*9.0)));
    if (g > 0.9975 && depth > 0.8) c = GLITW;
  }
  float fn = vnoise(wp*0.11 + vec2(uTime*0.12, -uTime*0.08));
  float band = fract(depth*0.65 - uTime*0.32 + fn*0.9);
  if (depth < 0.3 + fn*0.35) c = FOAMW;
  else if (depth < 2.4 && band < 0.16 && fn > 0.32) c = (band < 0.08 && lit) ? FOAMW : FOAMP;
  return c;
}

// ---- land
vec3 forestCol(float hv, float t){
  hv += (bay - 0.5)*0.1;
  if (hv < 0.36) return r_FCRIM(t);
  if (hv < 0.64) return r_FORANGE(t);
  return r_FGOLD(t);
}
vec3 shadeLand(vec3 p, float h, vec4 nn, vec4 mm, float lt, float pxm, vec2 uv, float lod){
  vec3 n = vec3(nn.x*2.0 - 1.0, 0.0, nn.y*2.0 - 1.0);
  n.y = sqrt(max(0.0, 1.0 - n.x*n.x - n.z*n.z));
  float slope = 1.0 - n.y;
  float nd = dot(n, uSun);
  float light = clamp((nd + 0.1)*2.4, 0.0, 1.0)*lt;
  float tt = 0.27 + 0.66*light + (nn.w - 0.55)*0.45;
  float tf = fract(h/14.0);
  tt -= (1.0 - smoothstep(0.0, 0.2, tf))*0.12*clamp(slope*6.0, 0.0, 1.0);
  float jit = mm.w - 0.5;
  float hj = h + jit*50.0;
  vec2 sxz = normalize(uSun.xz);
  if (h < 0.42 + jit*1.1 && slope < 0.25) return r_SAND(tt + 0.05);
  float near = 1.0 - smoothstep(1.5, 4.0, pxm);
  float rd1 = vnoise(p.xz/9.0 + h*0.03), rd2 = vnoise(p.xz/3.1);
  if (hj > 370.0 && slope < 0.62) return r_SNOW(tt + 0.12 + (rd1 - 0.5)*0.22 + (rd2 - 0.5)*0.12*near);
  if (slope > 0.55 + jit*0.25 || hj > 305.0) {
    // rock: broken facets plus strata lines that follow the height
    float strata = smoothstep(0.0, 0.22, fract(h/8.0 + rd1*0.7));
    return r_ROCK(tt + (rd1 - 0.5)*0.34 + (rd2 - 0.5)*0.2*near - (1.0 - strata)*0.16);
  }
  float forest = mm.x*(1.0 - smoothstep(0.34, 0.5, slope));
  if (forest + (bay - 0.5)*0.3 > 0.5) {
    if (pxm < 2.4) {
      // tree crowns: jittered cells (Worley F1/F2), lit on the sun side, dark gaps between crowns
      vec2 q = p.xz/5.6, ci = floor(q), cf = fract(q);
      float f1 = 9.0, f2 = 9.0; vec2 bv = vec2(0.0), bci = vec2(0.0);
      for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
        vec2 g = vec2(float(i), float(j));
        vec2 v = g + vec2(hash12(ci + g), hash12(ci + g + 17.3))*0.7 + 0.15 - cf;
        float d = dot(v, v);
        if (d < f1) { f2 = f1; f1 = d; bv = v; bci = ci + g; } else if (d < f2) f2 = d;
      }
      f1 = sqrt(f1); f2 = sqrt(f2);
      float rad = 0.4 + 0.16*hash12(bci + 4.4), k = f1/rad;
      vec2 dir = -bv/max(f1, 1e-3);
      float ct;
      if (k < 1.0 && f2 - f1 > 0.05) ct = tt + 0.06 + 0.34*dot(dir, sxz)*smoothstep(0.1, 0.85, k);
      else ct = tt - 0.4;
      float th = hash12(bci + 2.2);
      float hv = mm.y + (hash12(bci + 7.7) - 0.5)*0.24;
      if (th < 0.11 + 0.12*smoothstep(150.0, 260.0, h)) return r_CONIFER(ct + 0.1);
      return forestCol(hv, ct);
    }
    // far canopy: mottled clumps and scattered dark conifer stands instead of flat paint
    float sc = max(16.0, pxm*5.0);
    float mot = vnoise(p.xz/sc) - 0.5;
    float con = vnoise(p.xz/(sc*1.7) + 7.3);
    if (con > 0.74 - 0.12*smoothstep(150.0, 260.0, h)) return r_CONIFER(tt + 0.05 + mot*0.4);
    return forestCol(mm.y + mot*0.12, tt - 0.02 + mot*0.55);
  }
  float tm = tt;
  if (pxm < 6.0 && lt > 0.5) {
    float fw = textureLod(uM, uv + sxz*(11.0/WORLD), lod).x;
    if (fw > 0.55) tm -= 0.32;
  }
  vec3 c = (mm.z + (bay - 0.5)*0.12 > 0.5) ? r_MEADOW2(tm) : r_MEADOW(tm + 0.04);
  if (pxm < 2.6) {
    vec2 q = p.xz/12.0; vec2 ci = floor(q); vec2 cf = fract(q);
    float hh = hash12(ci + 41.0);
    if (hh < 0.04 + mm.x*0.3) {
      vec2 jp = vec2(hash12(ci + 1.3), hash12(ci + 7.9))*0.4 + 0.2;
      vec2 dv = (cf - jp)*12.0;
      float d = length(dv);
      float rad = 1.8 + hash12(ci + 3.3)*1.4;
      float along = -dot(dv, sxz);
      if (d < rad) c = hh < 0.012 ? r_CONIFER(tt + 0.2*dot(dv/rad, sxz) + 0.1) : forestCol(fract(mm.y + hh*7.0), tt + 0.25*dot(dv/rad, sxz));
      else if (lt > 0.5 && along > 0.0 && along < rad*4.5 && abs(dv.y) < rad*0.8) c = (mm.z > 0.5) ? r_MEADOW2(tm - 0.34) : r_MEADOW(tm - 0.3);
    }
  }
  return c;
}

// ---- missile impacts: scorch + embers on land, foam on water, expanding shock ring
void impacts(vec3 p, bool water, inout vec3 c){
  for (int i = 0; i < 8; i++) {
    vec4 im = uImp[i];
    if (im.w < 0.5) continue;
    float age = uTime - im.z;
    if (age < 0.0) continue;
    vec2 dv = p.xz - im.xy; float r = length(dv);
    if (r > 160.0) continue;
    float rn = vnoise(dv*0.18 + im.z);
    if (im.w < 1.5) {
      float rad = 12.0 + 8.0*rn;
      float fade = 1.0 - smoothstep(35.0, 70.0, age);
      if (r < rad && fade > bay && !water) {
        float k = r/rad;
        c = SCORCH[k < 0.55 ? 0 : (k < 0.8 ? 1 : 2)];
        vec2 ec = floor(p.xz*0.7);
        float e = hash13(vec3(ec, floor(uTime*7.0 + hash12(ec)*7.0)));
        float ef = 1.0 - smoothstep(5.0, 30.0, age);
        if (k < 0.85 && e > 1.0 - 0.12*ef) c = e > 1.0 - 0.05*ef ? EMBER1 : EMBER0;
      }
    } else if (im.w < 2.5) {
      float fade = 1.0 - age/14.0;
      float rad = 6.0 + sqrt(age)*9.0;
      if (fade > 0.0 && r < rad && water && rn*fade > 0.22 + bay*0.35) c = (r > rad*0.72) ? FOAMW : FOAMP;
    }
    if (age < 1.15 && im.w < 2.5) {
      float rr = 6.0 + age*125.0;
      float w = 2.5 + age*7.0;
      if (abs(r - rr) < w && bay < 1.0 - age/1.15) c = mix(c, vec3(1.0, 0.95, 0.86), 0.8);
    }
  }
}

vec3 shadeSurface(vec3 p, vec3 rd, float t){
  float pxm = t*uPxAng;
  float lod = max(0.0, log2(pxm/TEXEL));
  vec2 uv = p.xz*(1.0/WORLD);
  float h = textureLod(uH, uv, lod).r;
  vec4 nn = textureLod(uN, uv, lod);
  float lt = nn.z*dynShadow(p);
  vec3 c;
  bool water = h < 0.0;
  if (water) c = shadeWater(p, rd, h, lt, pxm);
  else { vec4 mm = textureLod(uM, uv, lod); c = shadeLand(p, h, nn, mm, lt, pxm, uv, lod); }
  impacts(p, water, c);
  return c;
}

vec3 shadeCloud(vec3 p, vec3 rd){
  float c0 = max(cloudC(p.xz), 0.001);
  float e = 6.0;
  float cx = cloudC(p.xz + vec2(e, 0.0)), cz = cloudC(p.xz + vec2(0.0, e));
  float h0 = cloudTop(p.xz, c0);
  float hx = cx > 0.0 ? cloudTop(p.xz + vec2(e, 0.0), cx) : CB - 40.0;
  float hz = cz > 0.0 ? cloudTop(p.xz + vec2(0.0, e), cz) : CB - 40.0;
  vec3 n = normalize(vec3(h0 - hx, e, h0 - hz));
  float hgt = clamp((p.y - CB)/CH, 0.0, 1.0);
  // stylised light: the low sun lifted so dome tops catch it, plus a warm rim on the sun side
  vec3 lc = normalize(uSun + vec3(0.0, 0.6, 0.0));
  float l = dot(n, lc);
  float t = 0.3 + max(l, -0.25)*0.66 + hgt*0.12 + max(dot(n.xz, normalize(uSun.xz)), 0.0)*0.1;
  // silver lining when the cloud is backlit by the low sun
  float back = max(dot(rd, uSun), 0.0);
  t += pow(1.0 - abs(dot(n, rd)), 3.0)*back*back*0.9;
  t -= (1.0 - jetShadow(p))*0.4;
  if (p.y < CB + 1.5 && rd.y > 0.0) return (bay < 0.5 + hgt) ? CLOUD[0] : CLOUDLO;
  int i = int(clamp(floor(t*4.0 + 0.5 + (bay - 0.5)*0.5), 0.0, 4.0));
  return CLOUD[i];
}

void main(){
  vec2 fc = gl_FragCoord.xy;
  bay = bayerAt(fc);
  if (fc.y < uPanelY) { oCol = vec4(0.07, 0.06, 0.09, 0.0); gl_FragDepth = 1.0; return; }
  vec2 ndc = fc/uRes*2.0 - 1.0;
  vec3 rd = normalize(uCamRot*vec3(ndc.x*uProj.x, (ndc.y - uProj.z)*uProj.y, 1.0));
  vec3 ro = uCamPos;
  vec3 F = uCamRot[2];

  // terrain / water heightfield march
  float tT = 1e9;
  float tmin = 0.5, tmax = MAXD;
  if (ro.y > uMaxH) { if (rd.y < -1e-4) tmin = max(tmin, (ro.y - uMaxH)/(-rd.y)); else tmin = 1e9; }
  if (rd.y > 1e-4) tmax = min(tmax, (uMaxH - ro.y)/rd.y);
  if (tmin < tmax) {
    float t = tmin, tp = tmin;
    bool hit = false;
    for (int i = 0; i < 220; i++) {
      if (float(i) >= uSteps) break;
      vec3 p = ro + rd*t;
      float lod = max(0.0, log2(t*uPxAng*(1.0/TEXEL)));
      float d = p.y - max(terrH(p.xz, lod), 0.0);
      if (d < 0.0) { hit = true; break; }
      if (t > tmax) break;
      tp = t;
      t += max(d*0.42, 0.25 + t*0.004);
    }
    if (hit) {
      float a = tp, b = t;
      for (int k = 0; k < 7; k++) {
        float m = 0.5*(a + b); vec3 p = ro + rd*m;
        float lod = max(0.0, log2(m*uPxAng*(1.0/TEXEL)));

// ------------------------------------------------------------------ main loop
let last = performance.now(), frames = 0;
function update(dt) {
  simT += dt;
  if (input.lDown && !input.ab && performance.now() - input.lAt > 220) input.ab = true;
  updateJet(dt);
  updateWeapons(dt);
  updateFX(dt);
  updateParticles(dt);
  updateCamera(dt);
  radarUpdate(dt);
  flash = Math.max(0, flash - dt * 3.2);
  shake = Math.max(0, shake - dt * 2.2);
  cloudOff[0] += 3.2 * dt; cloudOff[1] += 1.1 * dt;
  rebase();

}
function frame(now) {
  requestAnimationFrame(frame);
  const dtMs = now - last; last = now;
  if (!ready) return;
  qualityTick(dtMs);
  const dt = clamp(dtMs / 1000, 0.001, 0.05);
  try {
    const t0 = performance.now();
    update(dt);
    render();
    drawOverlay();
    perf.js += (performance.now() - t0 - perf.js) * 0.05;
    frames++;
  } catch (e) { errors.push(String(e && e.stack || e)); console.error(e); }
}
